# Server block do nginx. Vai para /etc/nginx/conf.d/default.conf na imagem --
# por cima do que a imagem oficial traz, e nao ao lado: dois server blocks
# disputando a porta 80 fariam o vencedor depender da ordem alfabetica do
# include.
#
# Serve dois arquivos de texto e nada mais.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # A extensao .ps1 nao existe no mime.types do nginx, entao sem isto a
    # resposta sairia com o default_type e o charset viraria loteria. O
    # Invoke-RestMethod do PowerShell 5.1 decodifica o corpo pelo charset
    # ANUNCIADO no cabecalho -- na ausencia dele assume ISO-8859-1, e um
    # script UTF-8 chega com os bytes trocados direto para o 'iex'.
    #
    # Os proprios scripts sao ASCII puro como segunda linha de defesa, mas
    # isso e para o dia em que algum intermediario raspar o cabecalho; a
    # correcao certa e aqui.
    types {
        text/plain  ps1;
    }
    default_type text/plain;
    charset utf-8;

    # Nada de versao do nginx no cabecalho nem na pagina de erro: este e o
    # unico servico do homelab que responde a quem nao fez login.
    server_tokens off;

    # 'nosniff' porque o corpo e codigo: sem ele um navegador poderia decidir
    # renderizar o conteudo como outra coisa.
    add_header X-Content-Type-Options "nosniff" always;

    # Sem cache em lugar nenhum do caminho -- nem na borda da Cloudflare, nem
    # no cliente. Uma copia velha de um script que se autoeleva e exatamente o
    # que nao pode acontecer: publicar uma correcao tem que valer na proxima
    # chamada, nao quando o TTL expirar.
    add_header Cache-Control "no-store" always;

    # 'if' dentro de server e desaconselhado no geral, mas 'return' e um dos
    # dois casos em que ele e seguro. Nao ha nada aqui para escrever ou
    # apagar, entao tudo que nao for leitura morre na porta.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # A rota principal. E o que 'irm https://arrowremove.arthru.com' recebe.
    location = / {
        try_files /install.ps1 =404;
    }

    location = /revert {
        try_files /revert.ps1 =404;
    }

    # Os nomes diretos tambem respondem -- servem para baixar com 'curl -O' e
    # ler o arquivo antes de executar, que e o ponto de servir isto em claro.
    location = /install.ps1 { }
    location = /revert.ps1  { }

    # So o healthcheck do compose bate aqui; poluir o log com isso a cada 30
    # segundos esconderia as requisicoes de verdade.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Qualquer outro caminho. Tambem mata a listagem de diretorio.
    location / {
        return 404 "arrowremove: use / para aplicar ou /revert para reverter.\n";
    }
}
